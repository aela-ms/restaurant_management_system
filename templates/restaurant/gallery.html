{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" href="{% static 'Images/logo.png' %}">
  <title>Crave & Co. | Gallery</title>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Include Header -->
  {% include 'restaurant/partials/header.html' %}

  <!-- Hero Section -->
  <section class="relative py-32 bg-gray-900 text-white text-center">
    <div class="max-w-3xl mx-auto px-6">
      <h1 class="text-4xl md:text-6xl font-bold mb-4">Our Photo Gallery</h1>
      <p class="text-gray-300 font-semibold text-lg md:text-xl leading-relaxed">
        Take a glance at our ambiance, culinary creations, and memorable moments.
      </p>
    </div>
  </section>

  <!-- Gallery Grid -->
  <section class="py-16">
    <div class="max-w-7xl mx-auto px-6">
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
        <div class="overflow-hidden rounded-xl shadow-lg">
          <img src="{% static 'Images/gallery1.jpg' %}" class="w-full h-64 object-cover hover:scale-105 transition duration-300" alt="Gallery Image 1">
        </div>
        <div class="overflow-hidden rounded-xl shadow-lg">
          <img src="{% static 'Images/gallery2.jpg' %}" class="w-full h-64 object-cover hover:scale-105 transition duration-300" alt="Gallery Image 2">
        </div>
        <div class="overflow-hidden rounded-xl shadow-lg">
          <img src="{% static 'Images/gallery3.jpg' %}" class="w-full h-64 object-cover hover:scale-105 transition duration-300" alt="Gallery Image 3">
        </div>
        <div class="overflow-hidden rounded-xl shadow-lg">
          <img src="{% static 'Images/gallery4.jpg' %}" class="w-full h-64 object-cover hover:scale-105 transition duration-300" alt="Gallery Image 4">
        </div>
        <div class="overflow-hidden rounded-xl shadow-lg">
          <img src="{% static 'Images/gallery5.jpg' %}" class="w-full h-64 object-cover hover:scale-105 transition duration-300" alt="Gallery Image 5">
        </div>
        <div class="overflow-hidden rounded-xl shadow-lg">
          <img src="{% static 'Images/gallery6.jpg' %}" class="w-full h-64 object-cover hover:scale-105 transition duration-300" alt="Gallery Image 6">
        </div>
      </div>
    </div>
  </section>

  <!-- Include Footer -->
  {% include 'restaurant/partials/footer.html' %}

</body>
</html>
