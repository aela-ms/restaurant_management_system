<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reserve a Table - Aura Bistro</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; background-color: #f8f9fa;">

    {% include 'restaurant/partials/header.html' %}

    <div style="max-width: 600px; margin: 3rem auto; padding: 2rem; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
        <h1 style="text-align: center; color: #1a1a1a; margin-top: 0;">Book a Table</h1>
        
        <!-- method="POST" goes on the form tag here -->
        <form method="POST">
            {% csrf_token %}
            
            <label style="display: block; margin-top: 1rem; font-weight: bold;">Full Name</label>
            <input type="text" name="name" required placeholder="John Doe" style="width: 100%; padding: 0.75rem; margin-top: 0.25rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">

            <label style="display: block; margin-top: 1rem; font-weight: bold;">Number of Guests</label>
            <input type="number" name="guests" min="1" max="20" value="2" required style="width: 100%; padding: 0.75rem; margin-top: 0.25rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">

            <label style="display: block; margin-top: 1rem; font-weight: bold;">Date</label>
            <input type="date" name="date" required style="width: 100%; padding: 0.75rem; margin-top: 0.25rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">

            <label style="display: block; margin-top: 1rem; font-weight: bold;">Time</label>
            <input type="time" name="time" required style="width: 100%; padding: 0.75rem; margin-top: 0.25rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">

            <button type="submit" style="width: 100%; margin-top: 1.5rem; background-color: #e67e22; color: white; padding: 0.75rem; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Confirm Reservation</button>
        </form>
    </div>

    {% include 'restaurant/partials/footer.html' %}

</body>
</html>
